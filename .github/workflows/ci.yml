name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The parent `fopost` SDK requires Python 3.10+, so this package cannot
        # support 3.9 — pip has no `fopost` release to resolve there.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
